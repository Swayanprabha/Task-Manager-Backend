# Database configuration
server.port=8090
spring.datasource.url=
# Check once with Postgres before running
spring.datasource.username=postgres
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
# Specifies the Gmail SMTP server address that will be used to send emails
spring.mail.port=
# Sets the port number 587 for Gmail's SMTP server (allows secure connection upgrade)
spring.mail.username=
# The Gmail email address from which emails will be sent
spring.mail.password=
# Gmail app-specific password for authentication (more secure than regular password)
spring.mail.properties.mail.smtp.auth=true
# Enables authentication - server requires username and password to verify before sending
spring.mail.properties.mail.smtp.starttls.enable=true
# Turns on TLS (encryption) support to secure the email transmission
spring.mail.properties.mail.smtp.starttls.required=true
# Forces the connection to upgrade to TLS encryption (makes it mandatory, not optional)
spring.mail.properties.mail.smtp.connectiontimeout=5000
# Maximum time (5000 milliseconds) to wait before giving up when establishing connection
spring.mail.properties.mail.smtp.timeout=5000
# Maximum time (5000 milliseconds) to wait for server response while reading data
spring.mail.properties.mail.smtp.writetimeout=5000
# Maximum time (5000 milliseconds) to wait before giving up when sending data to server

